<title>Carta Pengganti Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: ETP-portal shell with EN/BM switch; local masterlist loader; scope bar, KPI row, then the succession chart (MCP / OCP card grids) or a table; detail opens in a dialog.
   Palette mirrors the ETP portal tokens. R0/R1/R2 colours follow the readiness legend in the SRA documents. */
:root {
  --bg: #f8fcf6; --surface: #ffffff; --sunken: #f0f9ec; --line: #e6e6e6; --fg: #2a2b2e; --muted: #6a6b6d;
  --accent: #0d6636; --accent-fg: #ffffff; --accent2: #4a9437; --brand: #52de56; --brand-tint: #e3f3da;
  --ok: #0d6636; --warn: #945800; --bad: #c62828;
  --ok-bg: #e3f3da; --warn-bg: #fdf0dc; --bad-bg: #fbe4e4; --mute-bg: #eaeaea;
  --r0: #4a9437; --r0-fg: #ffffff; --r1: #f2d230; --r1-fg: #2a2b2e; --r2: #e06666; --r2-fg: #ffffff; --r3: #c9cbcd; --r3-fg: #2a2b2e;
  --pos-head: #e9ecef; --inc: #fbeee2;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1d1e20; --surface: #2a2b2e; --sunken: #232427; --line: #4d4d4d; --fg: #f4f4f5; --muted: #bfc0c0;
  --accent: #6ebe46; --accent-fg: #000000; --accent2: #52de56; --brand: #52de56; --brand-tint: #1f3d2a;
  --ok: #86e889; --warn: #f0a93b; --bad: #ff6b6b;
  --ok-bg: #1f3d2a; --warn-bg: #3a2a10; --bad-bg: #3d1616; --mute-bg: #3a3b3e;
  --r0: #5aa844; --r0-fg: #0b1a0e; --r1: #e3c53a; --r1-fg: #1d1e20; --r2: #e57373; --r2-fg: #1d1e20; --r3: #6b6d70; --r3-fg: #f4f4f5;
  --pos-head: #34363a; --inc: #3a3026;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #1d1e20; --surface: #2a2b2e; --sunken: #232427; --line: #4d4d4d; --fg: #f4f4f5; --muted: #bfc0c0;
  --accent: #6ebe46; --accent-fg: #000000; --accent2: #52de56; --brand: #52de56; --brand-tint: #1f3d2a;
  --ok: #86e889; --warn: #f0a93b; --bad: #ff6b6b;
  --ok-bg: #1f3d2a; --warn-bg: #3a2a10; --bad-bg: #3d1616; --mute-bg: #3a3b3e;
  --r0: #5aa844; --r0-fg: #0b1a0e; --r1: #e3c53a; --r1-fg: #1d1e20; --r2: #e57373; --r2-fg: #1d1e20; --r3: #6b6d70; --r3-fg: #f4f4f5;
  --pos-head: #34363a; --inc: #3a3026;
  color-scheme: dark;
}

[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; border-top: 4px solid var(--brand); background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px;
  padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; }
h2 { font-size: 15px; font-weight: 600; margin: 0; text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: grid; gap: 2px; }
.brand small { color: var(--muted); }
.top-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; min-width: 0; max-width: 100%; }
.lang { display: inline-flex; background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; flex: none; }
.lang button { border: 0; background: none; padding: 6px 10px; border-radius: 6px; color: var(--muted); font-weight: 600; font-size: 12px; cursor: pointer; letter-spacing: .04em; }
.lang button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
nav { display: flex; gap: 4px; background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 3px; overflow-x: auto; max-width: 100%; }
nav button { border: 0; background: none; padding: 6px 12px; border-radius: 6px; color: var(--muted); font-weight: 500; white-space: nowrap; cursor: pointer; }
nav button[aria-current="page"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.banner { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 9px 12px; font-size: 13px; }
.banner.file { background: var(--brand-tint); color: var(--fg); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 500; }
.note { color: var(--muted); font-size: 12px; }
.error { color: var(--bad); font-size: 13px; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 8px 16px; flex-wrap: wrap; }
.section-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; max-width: 72ch; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.localrow { display: flex; gap: 12px 16px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.localtext { display: grid; gap: 4px; flex: 1 1 320px; min-width: 0; }
.localactions { display: flex; gap: 8px; flex-wrap: wrap; }
label.btn { display: inline-block; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 7px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--sunken); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.seg { display: inline-flex; background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 6px; color: var(--muted); font-weight: 500; font-size: 13px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.scope { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.scope .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.scope select, .scope input { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; max-width: 100%; }
.scope select { max-width: 260px; }
.scope input[type=search] { flex: 1 1 200px; min-width: 0; }
.scope .push { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.pill { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .03em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.p-ok { color: var(--ok); background: var(--ok-bg); } .p-warn { color: var(--warn); background: var(--warn-bg); } .p-bad { color: var(--bad); background: var(--bad-bg); } .p-mute { color: var(--muted); background: var(--mute-bg); }
.p-new { color: var(--accent); background: var(--surface); border: 1px solid var(--accent); padding: 1px 7px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { border-left: 3px solid var(--line); gap: 4px; }
.kpi.accent { border-left-color: var(--accent); } .kpi.ok { border-left-color: var(--ok); } .kpi.warn { border-left-color: var(--warn); } .kpi.bad { border-left-color: var(--bad); }
.kpi .value { font-family: var(--mono); font-size: 28px; font-weight: 500; font-variant-numeric: tabular-nums; }
.kpi .value small { font-size: 14px; color: var(--muted); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 22px; height: 14px; border-radius: 3px; display: inline-block; flex: none; }
.sw.r0 { background: var(--r0); } .sw.r1 { background: var(--r1); } .sw.r2 { background: var(--r2); } .sw.r3 { background: var(--r3); }
.sw.rep { border: 1.5px dashed var(--muted); }

.cat-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.cat-head .tag { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--accent); }
.mcp-wrap { display: grid; justify-items: center; }
.mcp-wrap .pos { width: min(680px, 100%); }
.pos-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
@media (max-width: 980px) { .pos-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .pos-grid { grid-template-columns: 1fr; } }

.pos { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: grid; align-content: start; background: var(--surface); min-width: 0; }
.pos.risk-high { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
.pos-head { background: var(--pos-head); padding: 10px 12px; display: grid; gap: 2px; text-align: center; }
.pos-head b { font-size: 13px; line-height: 1.3; }
.pos-head small { font-size: 11px; color: var(--muted); }
.pos-inc { background: var(--inc); padding: 8px 12px; text-align: center; font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
.pos-inc.vac { color: var(--bad); }
.pos-inc small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; margin-top: 1px; }
.pos-meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.pos-meta b { font-family: var(--mono); color: var(--fg); font-weight: 500; }
.pos-body { padding: 10px 12px 12px; display: grid; gap: 6px; }
.grp { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.grp:first-child { margin-top: 0; }

.succ { display: grid; grid-template-columns: minmax(0, 1fr) 38px; align-items: stretch; border: 1px solid var(--fg); border-radius: 4px; overflow: hidden; background: var(--surface); cursor: pointer; text-align: left; padding: 0; width: 100%; }
.succ:hover .succ-main { background: var(--sunken); }
.succ-main { padding: 6px 9px; display: grid; gap: 1px; min-width: 0; }
.succ-name { font-weight: 600; font-size: 12.5px; line-height: 1.3; overflow-wrap: anywhere; }
.succ-sub { font-size: 11px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.succ-sub .num { font-family: var(--mono); color: var(--fg); }
.chip { display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 600; border-left: 1px solid var(--fg); }
.chip.r0 { background: var(--r0); color: var(--r0-fg); } .chip.r1 { background: var(--r1); color: var(--r1-fg); } .chip.r2 { background: var(--r2); color: var(--r2-fg); } .chip.r3 { background: var(--r3); color: var(--r3-fg); }
.succ.struck { cursor: default; border-color: var(--line); grid-template-columns: 1fr; }
.succ.struck .succ-name { text-decoration: line-through; text-decoration-color: var(--bad); color: var(--muted); font-weight: 500; }
.succ.struck:hover .succ-main { background: none; }
.succ.rep { border: 1.5px dashed var(--muted); }
.succ.rep .chip { border-left: 1.5px dashed var(--muted); }
.succ.dim { opacity: .3; }
.succ.hit { box-shadow: 0 0 0 2px var(--accent); }
.flag { color: var(--warn); font-weight: 600; }
.flag.bad { color: var(--bad); }
.empty-succ { font-size: 12px; color: var(--bad); padding: 6px 0; }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }

.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 13px; }
th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
th.num { font-family: var(--font); }
tbody tr.clk { cursor: pointer; } tbody tr.clk:hover { background: var(--sunken); }
.rd { display: inline-grid; place-items: center; min-width: 30px; padding: 2px 6px; border-radius: 5px; font-family: var(--mono); font-weight: 600; font-size: 12px; }
.rd.r0 { background: var(--r0); color: var(--r0-fg); } .rd.r1 { background: var(--r1); color: var(--r1-fg); } .rd.r2 { background: var(--r2); color: var(--r2-fg); } .rd.r3 { background: var(--r3); color: var(--r3-fg); }
.sub { color: var(--muted); font-size: 12px; }
.map td:first-child { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
details.ref { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
details.ref summary { cursor: pointer; font-weight: 600; }
details.ref[open] summary { margin-bottom: 10px; }

.notes { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13px; line-height: 1.5; }

dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(700px, calc(100vw - 32px)); max-height: calc(100vh - 32px); background: var(--surface); color: var(--fg); }
dialog::backdrop { background: rgba(10, 16, 24, .45); }
.dlg { display: grid; gap: 14px; padding: 18px; }
.dlg-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.dlg-head h2 { font-size: 18px; }
.dlg-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 560px) { .dlg-grid { grid-template-columns: 1fr; } }
.kv { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.box { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) 70px; gap: 4px 10px; align-items: center; font-size: 12.5px; }
.bar-row .n { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.bar-row .n small { color: var(--muted); }
.bar-track { grid-column: 1 / -1; background: var(--sunken); border-radius: 4px; height: 8px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent2); border-radius: 4px; }
.total { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 8px; }
.total b { font-family: var(--mono); font-size: 22px; font-weight: 500; }
.gaps { margin: 0; padding-left: 18px; font-size: 13px; display: grid; gap: 3px; }
.asp { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 12.5px; }
.asp li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; }
.tick { font-family: var(--mono); font-weight: 600; }
.tick.y { color: var(--ok); } .tick.n { color: var(--bad); }
.callout { border-left: 3px solid var(--warn); background: var(--warn-bg); border-radius: 0 8px 8px 0; padding: 8px 12px; font-size: 13px; }
.callout.bad { border-left-color: var(--bad); background: var(--bad-bg); }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 20; max-width: calc(100vw - 32px); }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
.dist { display: grid; gap: 14px; }
.dist-row { display: grid; gap: 6px; font-size: 13px; }
.stackbar { display: flex; height: 28px; border-radius: 6px; overflow: hidden; background: var(--sunken); }
.stackbar div { display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 600; min-width: 0; overflow: hidden; white-space: nowrap; }
.stackbar .r0 { background: var(--r0); color: var(--r0-fg); } .stackbar .r1 { background: var(--r1); color: var(--r1-fg); } .stackbar .r2 { background: var(--r2); color: var(--r2-fg); } .stackbar .r3 { background: var(--r3); color: var(--r3-fg); }
.bar-fill.hot { background: var(--bad); } .bar-fill.warm { background: var(--warn); }
.risk-list { display: grid; gap: 8px; }
.risk-item { display: grid; gap: 2px; text-align: left; border: 1px solid var(--line); border-left: 3px solid var(--bad); border-radius: 8px; padding: 8px 10px; background: var(--surface); cursor: pointer; width: 100%; }
.risk-item:hover { background: var(--sunken); }
.risk-item b { font-size: 13px; } .risk-item span { font-size: 12px; color: var(--muted); }
.rv td { vertical-align: top; }
.rv td.role { background: var(--pos-head); font-weight: 600; min-width: 170px; }
.rv select { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: var(--surface); max-width: 170px; }
.rv-sum { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.gaps-cell { font-size: 12px; line-height: 1.4; min-width: 180px; max-width: 300px; }
.lnk { border: 0; background: none; padding: 0; color: inherit; cursor: pointer; text-align: left; font: inherit; font-weight: 500; }
.lnk:hover { color: var(--accent); text-decoration: underline; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <div class="top">
    <div class="brand"><h1>Succession Planning Portal</h1><small data-i="sub"></small></div>
    <div class="top-right">
      <div class="lang" role="group" aria-label="Language / Bahasa">
        <button type="button" id="lgEN" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" id="lgMS" data-lang="ms" aria-pressed="false">BM</button>
      </div>
      <nav id="nav">
        <button type="button" data-view="dash" data-i="navDash"></button>
        <button type="button" data-view="chart" aria-current="page" data-i="navChart"></button>
        <button type="button" data-view="rv" data-i="navRV"></button>
        <button type="button" data-mock="idp" data-i="navIDP"></button>
        <button type="button" data-mock="card" data-i="navCard"></button>
      </nav>
    </div>
  </div>

  <div class="banner" id="banner"></div>

  <section class="panel">
    <div class="localrow">
      <div class="localtext">
        <h2 data-i="loadTitle"></h2>
        <div class="note" id="loadNote"></div>
      </div>
      <div class="localactions">
        <label class="btn primary" for="fileIn" data-i="chooseFile"></label>
        <input type="file" id="fileIn" accept=".xlsx,.xls" hidden>
        <button type="button" class="btn" id="useSample" hidden data-i="useSample"></button>
      </div>
    </div>
    <div class="error" id="loadErr" hidden></div>
  </section>

  <div class="scope">
    <span class="lbl" data-i="scope"></span>
    <select id="fDept"></select>
    <select id="fCat"><option value="" data-i="catAll"></option><option value="MCP" data-i="catMCP"></option><option value="OCP" data-i="catOCP"></option></select>
    <input type="search" id="fSearch">
    <div class="push">
      <span class="lbl" data-i="scale"></span>
      <div class="seg" role="group" id="scaleGrp">
        <button type="button" id="scCur" aria-pressed="true" data-i="scCur"></button>
        <button type="button" id="scNew" aria-pressed="false" data-i="scNew"></button>
      </div>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <section id="view-dash" class="stack" hidden>
    <div class="grid2">
      <div class="panel"><div class="section-head"><h2 data-i="distTitle"></h2><span class="note" id="distNote"></span></div><div id="dist" class="dist"></div></div>
      <div class="panel"><h2 data-i="tlTitle"></h2><div id="tl" class="bars"></div></div>
    </div>
    <div class="panel">

  function parseWorkbook(wb, fileName) {

  // ---------- State + helpers ----------

  const fmtYM = s => { if (!s) return "–"; const d = ym(s); return L().months12[d.m - 1] + " " + d.y; };

  const level = (t, cat, sc = scale) => SCALES[sc][cat].find(([min]) => t >= min)[1];
  const lvCls = l => (l === "-" || !l) ? "r3" : l.toLowerCase();

    $("mapRows").innerHTML = MAP.map(([c, f]) => `<tr><td>${esc(c)}</td><td>${esc(tx(f))}</td></tr>`).join("");
  }

  function renderLegend() {
    const cats = [...new Set(visible().map(p => p.cat))]; if (!cats.length) cats.push("MCP");
    const rng = (b, i) => i === 0 ? `≥${b[0][0]}%` : i === b.length - 1 ? `≤${b[i - 1][0] - 1}%` : `${b[i][0]}–${b[i - 1][0] - 1}%`;
    const base = SCALES[scale][cats[0]];
    const same = cats.every(c => JSON.stringify(SCALES[scale][c]) === JSON.stringify(base));
    $("legend").innerHTML = base.map(([, l], i) => {
      const r = same ? rng(base, i) : cats.map(c => `${c} ${rng(SCALES[scale][c], i)}`).join(" · ");
      return `<span><i class="sw ${lvCls(l)}"></i>${l === "-" ? L().notReady : l + " " + desc(l)} <span class="note">${r}</span></span>`;
    }).join("") + (DATA.source === "sample" ? `<span><i class="sw rep"></i>${L().repLegend}</span><span><span class="pill p-new">${L().newPill}</span>${L().newLegend}</span>` : `<span><span class="flag bad">${L().noMeetFlag}</span>${L().stat.nomeet}</span>`);
    $("scaleNote").textContent = L().scaleNote(L().scaleName[scale]);
  }

  function renderKpis() {
    const ps = visible(), an = ps.map(analyse);
    const cov = an.filter(a => a.internal.length).length, r0 = an.filter(a => a.hasR0).length, high = an.filter(a => a.risk === "high").length;
    const succN = new Set(ps.flatMap(p => p.succ.filter(s => s.st !== "struck").map(s => s.key))).size, vac = ps.filter(p => p.inc.vacant).length;
    const pc = (a, b) => b ? Math.round(a / b * 100) : 0;
    $("kpis").innerHTML = `
      <div class="panel kpi accent"><span class="label">${L().kPos}</span><span class="value">${ps.length}</span><span class="note">${L().kPosN(succN, vac)}</span></div>
      <div class="panel kpi ok"><span class="label">${L().kCov}</span><span class="value">${pc(cov, ps.length)}<small>%</small></span><span class="note">${L().kCovN(cov, ps.length)}</span></div>
      <div class="panel kpi ${r0 === ps.length ? "ok" : "warn"}"><span class="label">${L().kR0}</span><span class="value">${pc(r0, ps.length)}<small>%</small></span><span class="note">${L().kR0N(r0, ps.length)}</span></div>
      <div class="panel kpi ${high ? "bad" : "ok"}"><span class="label">${L().kHigh}</span><span class="value">${high}</span><span class="note">${L().kHighN}</span></div>`;
  }

  const RISKC = { high: "p-bad", med: "p-warn", low: "p-ok" };
  function succBtn(p, s, idx) {
    const per = s.p, t = total(s), l = level(t, p.cat), term = q();
    const hit = term && per.n.toLowerCase().includes(term), dim = term && !hit;
    const nm = `${esc(per.n)}${per.g ? ` (${esc(per.g)})` : ""}`;
    if (s.st === "struck") return `<div class="succ struck${dim ? " dim" : ""}"><div class="succ-main"><span class="succ-name">${nm}</span><span class="succ-sub">${L().removed}</span></div></div>`;
    const flags = (runwayShort(s, p) ? `<span class="flag" title="${L().shortTitle}">⚠ ${L().shortRunway}</span>` : "") +
      (s.st === "nomeet" ? `<span class="flag bad" title="${esc(failed(s).map(k => L().crit[k]).join(", "))}">${L().noMeetFlag}</span>` : "");
    return `<button type="button" class="succ${s.st === "rep" ? " rep" : ""}${hit ? " hit" : ""}${dim ? " dim" : ""}" data-p="${p.id}" data-x="${idx}">
      <span class="succ-main"><span class="succ-name">${nm}</span>
      <span class="succ-sub"><span class="num">${t.toFixed(1)}%</span>${s.st === "new" ? `<span class="pill p-new">${L().newPill}</span>` : ""}${flags}</span></span>
      <span class="chip ${lvCls(l)}">${l}</span></button>`;
  }
  function posCard(p) {
    const a = analyse(p), inc = p.inc;
    const items = p.succ.map((s, i) => [s, i]);
    const internal = items.filter(([s]) => s.st !== "rep"), reps = items.filter(([s]) => s.st === "rep");
    const meta = inc.vacant ? L().vacantNow : a.mo == null ? L().noEnd : a.mo < 0 ? L().overdue(-a.mo) : L().vacantIn(a.mo);
    const incRow = inc.vacant ? `<div class="pos-inc vac">${L().vacantName}<small>${L().vacantSub}</small></div>`
      : `<div class="pos-inc">${esc(inc.n)}<small>${L().incumbent} · ${inc.end ? L().end[inc.et] + " " + fmtYM(inc.end) : L().noEnd}</small></div>`;
    return `<article class="pos${a.risk === "high" ? " risk-high" : ""}">
      <div class="pos-head"><b>${esc(tx(p.t))}${p.g ? ` (${esc(p.g)})` : ""}</b>${!dept && p.dept ? `<small>${esc(deptLabel(p.dept))}</small>` : ""}</div>
      ${incRow}
      <div class="pos-meta"><span>${meta}</span><span class="pill ${RISKC[a.risk]}">${L().risk[a.risk]}</span></div>
      <div class="pos-body">
        <div class="grp">${L().internal}</div>
        ${internal.length ? internal.map(([s, i]) => succBtn(p, s, i)).join("") : `<div class="empty-succ">${L().none}</div>`}
        ${reps.length ? `<div class="grp">${L().reps}</div>${reps.map(([s, i]) => succBtn(p, s, i)).join("")}` : ""}
      </div></article>`;
  }
  function renderChart() {
    const ps = visible(), m = ps.filter(p => p.cat === "MCP"), o = ps.filter(p => p.cat === "OCP");
    $("mcp").className = m.length === 1 ? "mcp-wrap" : "pos-grid";
    $("mcp").innerHTML = m.map(posCard).join(""); $("ocp").innerHTML = o.map(posCard).join("");
    $("mcpHead").hidden = $("mcp").hidden = !m.length;
    $("ocpHead").hidden = $("ocp").hidden = !o.length;
    $("chartEmpty").hidden = ps.length > 0;
  }
  function renderTable() {
    const term = q(), SC = { ok: "p-ok", new: "p-mute", struck: "p-bad", rep: "p-warn", meet: "p-ok", nomeet: "p-bad" };
    $("rows").innerHTML = visible().flatMap(p => p.succ.map((s, i) => {
      if (term && !s.p.n.toLowerCase().includes(term)) return "";
      const t = total(s), l = level(t, p.cat), struck = s.st === "struck";
      return `<tr class="${struck ? "" : "clk"}" ${struck ? "" : `data-p="${p.id}" data-x="${i}"`}>
        <td><b>${esc(tx(p.t))}</b> <span class="sub">${esc(p.g)}</span></td><td>${p.cat}</td>
        <td>${esc(s.p.n)} <span class="sub">${esc(s.p.g)}</span></td>
        <td class="num">${s.exp.toFixed(1)}%</td><td class="num">${s.fit.toFixed(1)}%</td><td class="num">${s.fun.toFixed(1)}%</td>
        <td class="num"><b>${t.toFixed(1)}%</b></td><td>${struck ? "–" : `<span class="rd ${lvCls(l)}">${l}</span>`}</td>
        <td><span class="pill ${SC[s.st]}">${L().stat[s.st]}</span></td></tr>`;
    })).join("") || `<tr><td colspan="9" class="sub" style="text-align:center;padding:24px">${esc(term ? L().noMatch(term) : L().emptyScope)}</td></tr>`;
  }
  function renderNotes() {
    const out = [], vis = visible();
    const vac = vis.filter(p => p.inc.vacant).length;
    if (vac) out.push(L().nVac(vac));
    vis.forEach(p => {
      const a = analyse(p), inc = p.inc;
      if (a.risk === "high") {
        const why = inc.vacant ? L().nHighWhy.vac : a.mo < 0 ? L().nHighWhy.past(L().end[inc.et], fmtYM(inc.end)) : L().nHighWhy.soon(L().end[inc.et], fmtYM(inc.end), a.mo);
        out.push(L().nHigh(esc(tx(p.t)), why));
      }
      p.succ.forEach(s => {
        if (!isInternal(s) && s.st !== "rep") return;
        if (runwayShort(s, p)) out.push(L().nRunway(esc(s.p.n), esc(tx(p.t)), L().end[s.p.et], fmtYM(s.p.end), runwayGap(s, p)));
      });
    });
    const rowsAll = vis.flatMap(p => p.succ.map(s => [p, s]));
    const nm = rowsAll.filter(([, s]) => s.st === "nomeet");
    if (nm.length) {
      const c = {}; nm.forEach(([, s]) => failed(s).forEach(k => c[k] = (c[k] || 0) + 1));
      out.push(L().nNoMeet(nm.length, Object.entries(c).map(([k, n]) => `${L().critShort[k]} ${n}`).join(", ")));
    }
    const mis = rowsAll.filter(([p, s]) => s.fileLvl && s.fileLvl !== level(total(s), p.cat, "cur")).length;
    if (mis) out.push(L().nMismatch(mis));
    const est = vis.filter(p => p.inc.et === "est" && !p.inc.vacant).length;
    if (est) out.push(L().nEst(est));
    const counts = {}, names = {};
    rowsAll.forEach(([p, s]) => { if (s.st !== "struck") { (counts[s.key] = counts[s.key] || []).push(tx(p.t)); names[s.key] = s.p.n; } });
    Object.entries(counts).filter(([, v]) => v.length > 1).forEach(([k, v]) => out.push(L().nMulti(esc(names[k]), v.length, v.map(esc).join(", "))));
    Object.keys(counts).forEach(k => { if (DATA.positions.some(p => !p.inc.vacant && p.inc.key === k)) out.push(L().nChain(esc(names[k]))); });
    out.push(L().nIdp);
    $("notes").innerHTML = out.map(x => `<li>${x}</li>`).join("");
  }
  // ---------- Dashboard ----------
  const uc = t => t.charAt(0).toUpperCase() + t.slice(1);
  function whyText(p, a) {
    const inc = p.inc;
    return inc.vacant ? L().nHighWhy.vac : a.mo < 0 ? L().nHighWhy.past(L().end[inc.et], fmtYM(inc.end)) : L().nHighWhy.soon(L().end[inc.et], fmtYM(inc.end), a.mo);
  }
  function renderDash() {
    const ps = visible();
    $("distNote").textContent = L().distNote(L().scaleName[scale]);
    $("dist").innerHTML = ["MCP", "OCP"].filter(c => ps.some(p => p.cat === c)).map(c => {
      const lv = ps.filter(p => p.cat === c).flatMap(p => p.succ.filter(isInternal).map(s => level(total(s), c)));
      const labs = SCALES[scale][c].map(b => b[1]);
      return `<div class="dist-row"><b>${L().distCat(c, lv.length)}</b><div class="stackbar">${labs.map(l => { const n = lv.filter(x => x === l).length; return n ? `<div class="${lvCls(l)}" style="flex:${n}" title="${l}: ${n}">${l} · ${n}</div>` : ""; }).join("")}</div></div>`;
    }).join("") || `<p class="note">${L().emptyScope}</p>`;
    const b = [0, 0, 0, 0, 0, 0];
    ps.forEach(p => { const mo = analyse(p).mo; b[p.inc.vacant || (mo != null && mo <= 0) ? 0 : mo == null ? 5 : mo <= 12 ? 1 : mo <= 24 ? 2 : mo <= 36 ? 3 : 4]++; });
    const mx = Math.max(1, ...b);
    $("tl").innerHTML = L().tl.map((lab, i) => `<div class="bar-row"><span>${lab}</span><span class="n">${b[i]}</span><div class="bar-track"><div class="bar-fill${i === 0 ? " hot" : i <= 2 ? " warm" : ""}" style="width:${b[i] / mx * 100}%"></div></div></div>`).join("");
    const catF = $("fCat").value, pc = (a, n) => Math.round(a / n * 100) + "%";
    $("deptRows").innerHTML = DATA.depts.map(([k, lab]) => {
      const dp = DATA.positions.filter(p => p.dept === k && (!catF || p.cat === catF)); if (!dp.length) return "";
      const an = dp.map(analyse), cov = an.filter(a => a.internal.length).length, r0 = an.filter(a => a.hasR0).length, hi = an.filter(a => a.risk === "high").length;
      const vac = dp.filter(p => p.inc.vacant).length, nm = dp.reduce((n, p) => n + p.succ.filter(s => s.st === "nomeet").length, 0);
      return `<tr class="clk" data-dept="${esc(k)}"><td><b>${esc(tx(lab))}</b></td><td class="num">${dp.length}</td><td class="num">${pc(cov, dp.length)}</td><td class="num">${r0} <span class="sub">(${pc(r0, dp.length)})</span></td><td class="num">${hi ? `<span class="pill p-bad">${hi}</span>` : "0"}</td><td class="num">${vac}</td><td class="num">${nm}</td></tr>`;
    }).join("");
    const hi = ps.map(p => [p, analyse(p)]).filter(([, a]) => a.risk === "high");
    $("riskList").innerHTML = hi.length ? hi.map(([p, a]) => `<button type="button" class="risk-item" data-goto="${esc(p.dept)}"><b>${esc(tx(p.t))}</b><span>${esc(deptLabel(p.dept))} · ${p.cat} · ${esc(uc(whyText(p, a)))}</span></button>`).join("") : `<p class="note">${L().riskEmpty}</p>`;
    if (DATA.source !== "file") { $("critBars").innerHTML = `<p class="note">${L().critNoData}</p>`; return; }
    const c = {}; let tot = 0;
    ps.forEach(p => p.succ.forEach(s => { tot++; failed(s).forEach(k => c[k] = (c[k] || 0) + 1); }));
    const keys = Object.keys(L().crit), cm = Math.max(1, ...keys.map(k => c[k] || 0));
    $("critBars").innerHTML = keys.some(k => c[k]) ? keys.map(k => `<div class="bar-row"><span>${L().crit[k]}</span><span class="n">${c[k] || 0}<small> / ${tot}</small></span><div class="bar-track"><div class="bar-fill${c[k] ? " hot" : ""}" style="width:${(c[k] || 0) / cm * 100}%"></div></div></div>`).join("") : `<p class="note">${L().critNone}</p>`;
  }

  // ---------- Readiness validation ----------
  let VAL = {};
  function initVal() { VAL = {}; DATA.positions.forEach(p => p.succ.forEach((s, i) => { VAL[p.id + "|" + i] = s.st === "ok" ? "ok" : s.st === "rep" ? "rep" : "pending"; })); }
  function renderRV() {
    const term = q(); let html = "", tot = 0, done = 0; const lv = {};
    visible().forEach(p => {
      const ss = p.succ.map((s, i) => [s, i]).filter(([s]) => s.st !== "struck" && (!term || s.p.n.toLowerCase().includes(term)));
      ss.forEach(([s, i], j) => {
        const t = total(s), l = level(t, p.cat), key = p.id + "|" + i, v = VAL[key] || "pending";
        tot++; if (v === "ok" || v === "rep") done++; lv[l] = (lv[l] || 0) + 1;
        const f = failed(s);
        const gaps = s.gaps == null ? (f.length ? `<span class="flag bad">${L().noMeetFlag}: ${f.map(k => L().critShort[k]).join(", ")}</span>` : `<span class="sub">${L().gapsNone}</span>`) : (s.gaps.length ? s.gaps.map(g => esc(tx(g))).join(" · ") : `<span class="sub">${L().notAssessed}</span>`);
        html += `<tr>${j === 0 ? `<td class="role" rowspan="${ss.length}">${esc(tx(p.t))}${p.g ? ` (${esc(p.g)})` : ""}<div class="sub">${p.cat}${!dept ? " · " + esc(deptLabel(p.dept)) : ""}</div></td>` : ""}
          <td><button type="button" class="lnk" data-p="${p.id}" data-x="${i}">${esc(s.p.n)}</button> <span class="sub">${esc(s.p.g)}</span>${s.st === "rep" ? ` <span class="pill p-warn">${L().stat.rep}</span>` : ""}</td>
          <td class="num">${s.exp.toFixed(1)}%</td><td class="num">${s.fit.toFixed(1)}%</td><td class="num">${s.fun.toFixed(1)}%</td><td class="num"><b>${t.toFixed(1)}%</b></td>
          <td><span class="rd ${lvCls(l)}">${l}</span></td><td class="gaps-cell">${gaps}</td>
          <td><select data-val="${key}" aria-label="${L().thVal}">${Object.entries(L().val).map(([k, lab]) => `<option value="${k}"${k === v ? " selected" : ""}>${lab}</option>`).join("")}</select></td></tr>`;
      });
    });
    $("rvRows").innerHTML = html || `<tr><td colspan="9" class="sub" style="text-align:center;padding:24px">${esc(term ? L().noMatch(term) : L().emptyScope)}</td></tr>`;
    $("rvSum").innerHTML = Object.keys(lv).sort().map(l => `<span class="rd ${lvCls(l)}">${l} · ${lv[l]}</span>`).join("") + `<span class="pill ${tot && done === tot ? "p-ok" : "p-mute"}">${L().rvProgress(done, tot)}</span>`;
  }

  // ---------- Pages ----------
  let page = "chart";
  const FROM_HASH = { dashboard: "dash", chart: "chart", readiness: "rv" }, TO_HASH = { dash: "dashboard", chart: "chart", rv: "readiness" };
  const readHash = () => { page = FROM_HASH[location.hash.slice(1)] || "chart"; };
  function go(pg) { if (TO_HASH[pg] === location.hash.slice(1)) { page = pg; render(); } else location.hash = TO_HASH[pg]; }

  function render() {
    renderStatic(); renderLegend();
    $("view-dash").hidden = page !== "dash"; $("view-rv").hidden = page !== "rv"; $("chartPanel").hidden = page !== "chart";
    $("notesPanel").hidden = page === "rv"; $("kpis").hidden = page === "rv";
    if (page !== "rv") renderKpis();
    if (page === "dash") renderDash();

    if (page === "chart") { if (view === "chart") renderChart(); else renderTable(); }

    if ($("dlg").open && openRef) openDetail(openRef[0], openRef[1]);
  }

  // ---------- Dialog ----------
  let openRef = null;

          ${kv(L().endCap[per.et] || L().endCap.retire, fmtYM(per.end))}${kv(L().pms, esc(per.pms || "–"))}
          ${fromFile ? kv(L().staffNo, esc(per.staff)) + kv(L().type, esc(per.type)) + kv(L().svc, esc(per.svc)) + kv(L().qual, esc(per.qual)) : kv("IDP", s.prog ? L().prog[s.prog] : "–")}</dl></div>

          <div class="kv">
            <span class="note">${L().curScale}</span><span><span class="rd ${lvCls(lc)}">${lc}</span> ${desc(lc, "cur")}</span>
            <span class="note">${L().newScale}</span><span><span class="rd ${lvCls(ln)}">${ln}</span> ${desc(ln, "neu")}</span>
            ${s.fileLvl ? `<span class="note">${L().fileLvl}</span><span><span class="rd ${lvCls(s.fileLvl)}">${esc(s.fileLvl)}</span></span>` : ""}
          </div></div>
      </div>
      ${fails.length ? `<div class="callout bad">${L().noMeetCallout(fails.map(k => L().crit[k]).join(", "))}</div>` : ""}
      ${runwayShort(s, p) ? `<div class="callout">${L().runwayCallout(L().endCap[per.et], fmtYM(per.end), runwayGap(s, p))}</div>` : ""}
      <div class="dlg-grid">
        ${s.crit ? `<div class="box"><span class="label">${L().critTitle}</span><ul class="asp">${Object.keys(L().crit).map(k => { const v = s.crit[k]; return `<li><span class="tick ${v === false ? "n" : "y"}">${v === false ? "✗" : v ? "✓" : "–"}</span><span>${L().crit[k]}</span></li>`; }).join("")}</ul></div>` : ""}
        <div class="box"><span class="label">${L().gaps}</span>${s.gaps == null ? `<span class="note">${L().notInFile}</span>` : s.gaps.length ? `<ul class="gaps">${s.gaps.map(g => `<li>${esc(tx(g))}</li>`).join("")}</ul>` : `<span class="note">${L().notAssessed}</span>`}</div>
        ${!fromFile ? `<div class="box"><span class="label">${L().asp}</span><ul class="asp">${L().aspL.map((a, k) => { const y = per.asp && per.asp[k]; return `<li><span class="tick ${y ? "y" : "n"}">${y ? "✓" : "✗"}</span><span>${a}</span></li>`; }).join("")}</ul></div>` : ""}
      </div>
      <div class="actions"><button type="button" class="btn" data-mock="card">${L().openCard}</button><button type="button" class="btn primary" data-mock="idp">${L().openIdp}</button></div>`;
    if (!$("dlg").open) $("dlg").showModal();
    $("dClose").addEventListener("click", () => $("dlg").close());
  }
  $("dlg").addEventListener("click", e => { if (e.target === $("dlg")) $("dlg").close(); });
  $("dlg").addEventListener("close", () => { openRef = null; });

  // ---------- Events ----------
  let tt;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); }
  document.addEventListener("click", e => {
    const lg = e.target.closest("[data-lang]");
    if (lg) { lang = lg.dataset.lang; try { localStorage.setItem("sp-lang", lang); } catch (er) {} render(); return; }
    const nv = e.target.closest("[data-view]");
    if (nv) { go(nv.dataset.view); return; }
    const dg = e.target.closest("[data-dept],[data-goto]");
    if (dg) { dept = dg.dataset.dept || dg.dataset.goto; go("chart"); window.scrollTo({ top: 0 }); return; }
    const m = e.target.closest("[data-mock]");
    if (m) { toast(L().mockToast(L().mock[m.dataset.mock])); return; }
    const s = e.target.closest("[data-p]");
    if (s) openDetail(s.dataset.p, +s.dataset.x);
  });
  $("fileIn").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    $("loadErr").hidden = true;
    if (typeof XLSX === "undefined") { $("loadErr").textContent = L().loadErr("Excel reader did not load"); $("loadErr").hidden = false; return; }
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const wb = XLSX.read(new Uint8Array(rd.result), { type: "array", cellDates: true });
        DATA = parseWorkbook(wb, f.name); initVal();
        dept = DATA.depts.some(([k]) => k === "HAJJ") ? "HAJJ" : (DATA.depts[0] ? DATA.depts[0][0] : "");
        render();
      } catch (err) { $("loadErr").textContent = L().loadErr(err.message || String(err)); $("loadErr").hidden = false; }
      e.target.value = "";
    };
    rd.readAsArrayBuffer(f);
  });
  $("useSample").addEventListener("click", () => { SCALES = JSON.parse(JSON.stringify(DEFAULT_SCALES)); DATA = sampleData(); initVal(); dept = "HAJJ"; render(); });
  $("sendTrc").addEventListener("click", () => toast(L().trcToast(dept ? deptLabel(dept) : L().deptAll)));
  $("fDept").addEventListener("change", e => { dept = e.target.value; render(); });
  $("fCat").addEventListener("change", render);
  $("fSearch").addEventListener("input", render);
  const setScale = v => { scale = v; $("scCur").setAttribute("aria-pressed", String(v === "cur")); $("scNew").setAttribute("aria-pressed", String(v === "neu")); render(); };
  $("scCur").addEventListener("click", () => setScale("cur"));
  $("scNew").addEventListener("click", () => setScale("neu"));
  const setView = v => { view = v; $("vChart").setAttribute("aria-pressed", String(v === "chart")); $("vTable").setAttribute("aria-pressed", String(v === "table")); $("chartView").hidden = v !== "chart"; $("tableView").hidden = v !== "table"; render(); };
  $("vChart").addEventListener("click", () => setView("chart"));
  $("vTable").addEventListener("click", () => setView("table"));

  document.addEventListener("change", e => {
    const sel = e.target.closest("select[data-val]"); if (!sel) return;
    VAL[sel.dataset.val] = sel.value; renderRV();
    const again = document.querySelector(`select[data-val="${sel.dataset.val}"]`); if (again) again.focus();
  });
  window.addEventListener("hashchange", () => { readHash(); render(); });
  initVal(); readHash();
  render();
})();
</script>
